services:
  postgres:
    image: postgres:16
    container_name: caresync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caresync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - caresync_postgres_data:/var/lib/postgresql/data

volumes:
  caresync_postgres_data:
