spring:
  datasource:
    url: jdbc:h2:mem:caresync_testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

mail:
  enabled: false
  from: noreply@caresync.com

app:
  scheduling:
    timezone: Asia/Kolkata
    reminder-enabled: false

